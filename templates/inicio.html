<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Sistema POS</title>
    {% load static %}
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tailwind CSS por CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="{% static 'fronten/inicio.css' %}">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>
<body class="dashboard-body">

    <div class="layout-container">
        
        <!-- SIDEBAR (Menú lateral) -->
        <aside class="sidebar">
            <div class="sidebar-content">
                <h2 class="sidebar-title">POS Admin</h2>
                <nav class="sidebar-nav">
                    <a href="#" class="nav-link active">
                        <i class="fa-solid fa-users"></i> Cajeros
                    </a>
                    <a href="{% url 'inventario_view' %}" class="nav-link">
                        <i class="fa-solid fa-boxes-stacked"></i> Inventario
                    </a>
                    <a href="#" class="nav-link">
                        <i class="fa-solid fa-chart-line"></i> Reportes
                    </a>
                </nav>
     <div class="sidebar-footer">
    <form action="{% url 'logout' %}" method="post" class="inline">
        {% csrf_token %}
        <button type="submit" class="btn-logout w-full flex items-center gap-2">
            <i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión
        </button>
    </form>
</div>
 </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="main-content">
            
            <!-- Header Superior -->
            <header class="top-header">
                <h1 class="header-title">Gestión de Cajeros</h1>
                <div class="user-info">
                    <span>Administrador: <strong>{{ request.user.username }}</strong></span>
                </div>
            </header>

            <!-- Área de trabajo -->
            <div class="content-body">
                
                <div class="content-header">
                    <p class="content-subtitle">Aquí puedes dar de alta a los cajeros que operarán el sistema POS.</p>
                    <button id="btn-abrir-modal" class="btn-primary">
                        <i class="fa-solid fa-user-plus"></i> Registrar Nuevo Cajero
                    </button>
                </div>

                <!-- Tabla de Cajeros -->
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Usuario</th>
                                <th>Nombre</th>
                                <th>Estado</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="cajeros-tabla">
                            <!-- Se llena dinámicamente mediante JavaScript sin elementos estáticos fantasma -->
                        </tbody>
                    </table>
                </div>

            </div>
        </main>
    </div>

    <!-- MODAL PARA CREAR CAJERO -->
    <div id="modal-cajero" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Registrar Nuevo Cajero</h3>
                <button id="btn-cerrar-modal" class="btn-close">&times;</button>
            </div>
            
            <form id="form-cajero" class="modal-form">
                <div class="form-group">
                    <label>Nombre Completo</label>
                    <input type="text" id="nombre" required>
                </div>
                <div class="form-group">
                    <label>Nombre de Usuario</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="password" required>
                </div>
                
                <div id="mensaje-error" class="error-message hidden"></div>

                <div class="modal-actions">
                    <button type="button" id="btn-cancelar-modal" class="btn-secondary">Cancelar</button>
                    <button type="submit" class="btn-primary">Guardar Cajero</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JS Externo -->
    <script src="{% static 'javascript/inicio.js' %}"></script>
</body>
</html>
