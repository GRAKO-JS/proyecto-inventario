<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema POS - Inventario</title>
    <!-- Tailwind CSS por CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Enlace a tu archivo CSS personalizado -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/inicio.css' %}">
</head>
<body class="bg-slate-100 h-screen overflow-hidden">

    <!-- SECCIÓN 1: VISTA DE INICIO DE SESIÓN -->
    <div id="login-view" class="flex items-center justify-center h-full">
        <div class="bg-white p-8 rounded-xl shadow-md w-96">
            <h2 class="text-2xl font-bold text-center text-slate-800 mb-6">Iniciar Sesión</h2>
            
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700">Usuario</label>
                    <input type="text" id="username" required 
                        class="mt-1 block w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700">Contraseña</label>
                    <input type="password" id="password" required 
                        class="mt-1 block w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                </div>

                <div id="login-error" class="hidden text-red-600 text-sm text-center bg-red-50 p-2 rounded font-medium"></div>

                <button type="submit" 
                    class="w-full bg-indigo-600 text-white py-2 px-4 rounded-lg hover:bg-indigo-700 transition font-medium">
                    Entrar
                </button>
            </form>
        </div>
    </div>

    <!-- SECCIÓN 2: PANTALLA DEL POS (Oculta al inicio) -->
    <div id="pos-view" class="hidden flex h-full">
        <!-- Panel Izquierdo: Búsqueda -->
        <div class="w-2/3 p-6 flex flex-col space-y-4">
            <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm">
                <h1 class="text-xl font-bold text-slate-800">Caja POS</h1>
                <span id="user-display" class="text-sm bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full font-medium"></span>
            </div>

            <div class="relative">
                <input type="text" id="search-input" placeholder="Buscar producto por nombre o código..."
                    class="w-full px-4 py-3 bg-white border rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                
                <!-- Resultados flotantes -->
                <div id="search-results" class="absolute w-full bg-white border mt-1 rounded-xl shadow-lg z-10 max-h-60 overflow-y-auto hidden"></div>
            </div>
        </div>

        <!-- Panel Derecho: Carrito y Cobro -->
        <div class="w-1/3 bg-white p-6 border-l flex flex-col justify-between">
            <div>
                <h2 class="text-lg font-bold text-slate-800 mb-4">Ticket de Venta</h2>
                <div id="cart-items" class="space-y-3 max-h-[60vh] overflow-y-auto">
                    <p class="text-slate-400 text-sm text-center mt-10">No hay productos en el carrito</p>
                </div>
            </div>

            <div class="border-t pt-4">
                <button id="checkout-btn" 
                    class="w-full bg-emerald-600 text-white py-3 rounded-xl hover:bg-emerald-700 transition font-bold shadow-md">
                    Cobrar y Procesar Venta
                </button>
            </div>
        </div>
    </div>

    <!-- Enlace a tu archivo JavaScript independiente -->
    <script src="{% static 'js/inicio.js' %}"></script>
</body>
</html>
