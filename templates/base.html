<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema POS - Inventario</title>
    
    <!-- Archivos estáticos de Django -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'fronten/base.css' %}">
</head>
<body>

    <!-- SECCIÓN 1: VISTA DE INICIO DE SESIÓN -->
    <div id="login-view">
        <div class="login-card">
            <h2>Iniciar Sesión</h2>
            
            <!-- Quitamos action y method para que el JavaScript (Fetch) tome el control -->
            <form id="login-form">
                {% csrf_token %}

                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" name="username" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="password-container">
                        <input type="password" id="password" name="password" required>
                        <button type="button" id="toggle-password" title="Mostrar contraseña">🕶️</button>
                    </div>
                </div>

                <!-- Contenedor simple para mostrar el error de credenciales con JavaScript -->
                <div id="login-error" class="error-message" style="display: none; color: #ff4d4d; margin-top: 10px;"></div>

                <button type="submit" class="btn-primary">
                    Entrar
                </button>
            </form>
        </div>
    </div>

    <!-- Archivo JavaScript independiente -->
    <script src="{% static 'javascript/base.js' %}"></script>
</body>
</html>
