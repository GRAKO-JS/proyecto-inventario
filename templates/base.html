<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema POS - Inventario</title>
    
    <!-- Archivos estáticos de Django -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'fronten/base.css' %}">
</head>
<body>

    <!-- SECCIÓN 1: VISTA DE INICIO DE SESIÓN -->
    <div id="login-view">
        <div class="login-card">
            <h2>Iniciar Sesión</h2>
            
            <!-- El atributo action redirige a la página de inicio/POS al enviar -->
            <form id="login-form" action="/base/" method="GET">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" name="username" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div id="login-error" class="error-message" style="display: none;"></div>

                <button type="submit" class="btn-primary">
                    Entrar
                </button>
            </form>
        </div>
    </div>

    <!-- Enlace a tu archivo JavaScript independiente -->
    <script src="{% static 'javascript/base.js' %}"></script>
</body>
</html>
